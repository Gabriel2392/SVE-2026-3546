[package]
name = "android-resigner"
version = "0.1.0"
edition = "2024"
autobins = false
default-run = "android-resigner"

[lib]
name = "android_resigner"
path = "src/lib.rs"

[[bin]]
name = "android-resigner"
path = "src/bin/android_resigner.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[dependencies]
anyhow = "1"
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
hex = "0.4"
libc = "0.2"
lz4 = "1.28.1"
lz4_flex = { version = "0.14", features = ["frame"] }
md-5 = "0.11"
p384 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.11"
sha2_10 = { package = "sha2", version = "0.10" }
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"
twox-hash = "2.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }
